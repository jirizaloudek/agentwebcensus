name: daily-update
on:
  schedule:
    - cron: "17 5 * * *"      # daily 05:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    timeout-minutes: 90
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore registry crawl cache
        uses: actions/cache@v4
        with:
          path: data/raw/registry.jsonl
          key: registry-${{ github.run_id }}
          restore-keys: registry-
      - name: Fetch MCP Registry (incremental; full crawl on Sundays)
        run: |
          if [ "$(date -u +%u)" = "7" ]; then export FULL=1; fi
          python3 scripts/fetch_registry.py data/raw/registry.jsonl
      - name: Build MCP stats
        run: python3 scripts/build_mcp_stats.py data/raw/registry.jsonl
      - name: Scan AI-crawler policies (weekly on Mondays, or on manual run)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f data/web/latest.json ]; then
            python3 scripts/scan_web.py --top 10000 --out data/web/raw.jsonl && python3 scripts/build_web_stats.py
          fi
      - name: Check remote MCP servers (weekly on Wednesdays, or on manual run)
        run: |
          if [ "$(date -u +%u)" = "3" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f data/health/latest.json ]; then
            rm -f data/health/raw.jsonl && python3 scripts/check_remotes.py --out data/health/raw.jsonl && python3 scripts/build_health_stats.py
          fi
      - name: Build site
        run: python3 scripts/build_site.py
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy to Cloudflare Pages (optional)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy site --project-name "${{ vars.CF_PROJECT || 'agentwebcensus' }}" --branch main --commit-dirty=true
      - name: Commit aggregated data (history)
        run: |
          git config user.name "agent-web-census-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase -X theirs origin main
          git push
