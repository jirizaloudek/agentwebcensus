name: daily-update
on:
  schedule:
    - cron: "17 5 * * *"      # daily 05:17 UTC (full run)
    # Extra runs on central bank decision days only (gate job checks data/stats/cb_calendar.json):
    - cron: "10 4 * * *"      # BoJ / RBA (Asia morning)
    - cron: "25 12 * * *"     # Bank of England 12:00 UK
    - cron: "40 13 * * *"     # ECB 14:15 CET
    - cron: "30 19 * * *"     # Fed 14:00 ET
  workflow_dispatch:
    inputs:
      scans:
        description: "Also run the weekly scans (AI-crawler + remote MCP health)"
        default: "false"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: data/stats/cb_calendar.json, sparse-checkout-cone-mode: false }
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "17 5 * * *" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -q "\"$(date -u +%F)\"" data/stats/cb_calendar.json 2>/dev/null; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    timeout-minutes: 90
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://agents.datacensus.org' }}
      CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore registry crawl cache
        uses: actions/cache@v4
        with:
          path: data/raw/registry.jsonl
          key: registry-${{ github.run_id }}
          restore-keys: registry-
      - name: Fetch MCP Registry (incremental; full crawl on Sundays)
        run: |
          if [ "$(date -u +%u)" = "7" ]; then export FULL=1; fi
          python3 scripts/fetch_registry.py data/raw/registry.jsonl
      - name: Build MCP stats
        run: python3 scripts/build_mcp_stats.py data/raw/registry.jsonl
      - name: Scan AI-crawler policies (weekly on Mondays, or on manual run)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.scans }}" = "true" ] || [ ! -f data/web/latest.json ]; then
            python3 scripts/scan_web.py --top 10000 --out data/web/raw.jsonl && python3 scripts/build_web_stats.py
          fi
      - name: Check remote MCP servers (weekly on Wednesdays, or on manual run)
        run: |
          if [ "$(date -u +%u)" = "3" ] || [ "${{ inputs.scans }}" = "true" ] || [ ! -f data/health/latest.json ]; then
            rm -f data/health/raw.jsonl && python3 scripts/check_remotes.py --out data/health/raw.jsonl && python3 scripts/build_health_stats.py
          fi
      - name: Fetch economic indicators (OECD, BIS, IMF, World Bank, Eurostat)
        continue-on-error: true
        timeout-minutes: 15
        run: python3 scripts/fetch_fx.py; python3 scripts/fetch_indicators.py && python3 scripts/build_stats_releases.py; python3 scripts/fetch_cb_rates.py
      - name: Build site
        id: build
        run: python3 scripts/build_site.py
      - name: IndexNow key file
        run: python3 scripts/indexnow.py --key-only
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      # GitHub Pages deploys fail transiently ("Deployment failed, try again later",
      # "No artifacts named github-pages were found" right after a successful upload): retry once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow about changed pages
        if: steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success'
        continue-on-error: true
        run: sleep 30 && python3 scripts/indexnow.py
      - name: Deploy to Cloudflare Pages (optional)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy site --project-name "${{ vars.CF_PROJECT || 'agentwebcensus' }}" --branch main --commit-dirty=true
      # Data history is committed even if the Pages deploy failed (the next run redeploys the site).
      - name: Commit aggregated data (history)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git config user.name "agent-web-census-bot"
          git config user.email "actions@users.noreply.github.com"
          # Commit ONLY files this workflow generates (never `git add data`: that would delete/revert
          # data files pushed after this run's checkout). Rebase-free, never merges JSON line-by-line.
          GEN="data/mcp/latest.json data/mcp/history.csv data/web/latest.json data/web/history.csv data/web/domains.json data/web/tranco_meta.json data/health/latest.json data/health/servers.json data/health/history.csv data/indexnow_state.json data/stats/latest.json data/stats/releases.json data/stats/fx.json data/stats/cb_rates.json"
          mkdir -p /tmp/gen && for f in $GEN; do [ -e "$f" ] && mkdir -p "/tmp/gen/$(dirname $f)" && cp "$f" "/tmp/gen/$f"; done
          git fetch -q origin main
          git reset -q --hard origin/main
          for f in $GEN; do [ -e "/tmp/gen/$f" ] && mkdir -p "$(dirname $f)" && cp "/tmp/gen/$f" "$f" && git add "$f"; done
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push origin HEAD:main
