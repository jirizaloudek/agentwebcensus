name = "datacensus-mcp"
main = "src/index.js"
compatibility_date = "2025-07-18"
workers_dev = false

routes = [
  { pattern = "datacensus.org", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DATA_BASE = "https://agents.datacensus.org/data/"

[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "Feedback"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Feedback"]
